<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Charmly · the film</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #fbfbfd; }
      body { font: 16px/1.4 -apple-system, "SF Pro Text", BlinkMacSystemFont, "Helvetica Neue", sans-serif; -webkit-font-smoothing: antialiased; color: #111b21; }
      #camera { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
      .app { position: absolute; inset: 0; display: flex; }

      /* WhatsApp-style app */
      #wa { background: #e9edef; }
      #wa .side { width: 440px; background: #fff; border-right: 1px solid #e3e6e8; display: flex; flex-direction: column; }
      #wa .side h2 { padding: 26px 24px 18px; font-size: 26px; font-weight: 700; letter-spacing: -.02em; }
      #wa .search { margin: 0 18px 10px; padding: 10px 16px; border-radius: 10px; background: #f0f2f5; color: #8696a0; font-size: 15px; }
      #wa .item { display: flex; gap: 14px; align-items: center; padding: 14px 20px; }
      #wa .item.on { background: #f0f2f5; }
      #wa .item b { font-weight: 600; font-size: 17px; } #wa .item small { display: block; color: #667781; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 290px; }
      #wa .item time { margin-left: auto; align-self: flex-start; padding-top: 4px; font-size: 13px; color: #667781; }
      .avatar { width: 52px; height: 52px; border-radius: 50%; flex: none; background: linear-gradient(135deg, #fbc2eb, #a6c1ee); }
      .avatar.maya { background: linear-gradient(135deg, #ffd3a5, #fd6585); } .avatar.arun { background: linear-gradient(135deg, #a1c4fd, #c2e9fb); }
      .avatar.mom { background: linear-gradient(135deg, #d4fc79, #96e6a1); } .avatar.team { background: linear-gradient(135deg, #e0c3fc, #8ec5fc); }
      #wa .main { flex: 1; display: flex; flex-direction: column; background: #efeae2; position: relative; }
      #wa header { display: flex; align-items: center; gap: 14px; padding: 12px 22px; background: #f0f2f5; border-bottom: 1px solid #e3e6e8; }
      #wa header .avatar { width: 44px; height: 44px; } #wa header b { font-weight: 600; font-size: 17px; } #wa header small { display: block; font-size: 13.5px; color: #667781; }
      #wa .list { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; gap: 6px; padding: 24px 9% 22px; overflow: hidden; }
      #wa .row { display: flex; } #wa .row.out { justify-content: flex-end; }
      #wa .bubble { max-width: 62%; padding: 8px 12px 7px; border-radius: 10px; font-size: 17px; line-height: 1.38; background: #fff; box-shadow: 0 1px .5px rgba(11, 20, 26, .13); }
      #wa .row.out .bubble { background: #d9fdd3; }
      #wa .meta { float: right; margin: 8px 0 -4px 12px; font-size: 12px; color: #667781; } #wa .ticks { font-style: normal; color: #53bdeb; letter-spacing: -3px; margin-left: 3px; }
      #wa footer { display: flex; gap: 14px; align-items: center; padding: 12px 22px; background: #f0f2f5; }
      #wa .plus { font-size: 28px; color: #54656f; width: 30px; text-align: center; }
      #wa .box { flex: 1; min-height: 48px; padding: 12px 16px; border-radius: 10px; background: #fff; font-size: 17px; outline: none; white-space: pre-wrap; }
      #wa .box:empty::before { content: "Type a message"; color: #8696a0; }
      #wa .send { width: 48px; height: 48px; border-radius: 50%; border: 0; background: #00a884; color: #fff; font-size: 21px; }

      /* Messenger-style app */
      #ms { background: #fff; }
      #ms nav { width: 360px; border-right: 1px solid #e4e6eb; padding: 18px 12px; }
      #ms nav h2 { font-size: 26px; font-weight: 700; padding: 6px 12px 16px; letter-spacing: -.02em; }
      #ms nav div { display: flex; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 10px; font-size: 16px; } #ms nav div.on { background: #f0f2f5; font-weight: 600; }
      #ms nav .avatar { width: 48px; height: 48px; }
      #ms .pane { flex: 1; display: flex; flex-direction: column; }
      #ms .head { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid #e4e6eb; font-weight: 600; font-size: 17px; } #ms .head .avatar { width: 40px; height: 40px; }
      #ms .log { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; gap: 6px; padding: 24px 28px; }
      #ms .row { display: flex; } #ms .row.out { justify-content: flex-end; }
      #ms .bubble { max-width: 58%; padding: 10px 15px; border-radius: 20px; background: #f0f0f0; font-size: 17px; }
      #ms .row.out .bubble { background: #0084ff; color: #fff; }
      #ms form { display: flex; gap: 12px; align-items: center; padding: 14px 22px 18px; }
      #ms [contenteditable] { flex: 1; min-height: 44px; padding: 11px 18px; border-radius: 22px; background: #f0f2f5; font-size: 17px; outline: none; }
      #ms [contenteditable]:empty::before { content: "Aa"; color: #8a8d91; }
      #ms .go { color: #0084ff; font-weight: 600; }

      /* cursor */
      #cursor { position: absolute; left: 0; top: 0; width: 30px; height: 30px; z-index: 2147483647; filter: drop-shadow(0 3px 5px rgba(0, 0, 0, .3)); pointer-events: none; }
      #ripple { position: absolute; left: 0; top: 0; width: 44px; height: 44px; border-radius: 50%; background: rgba(255, 95, 162, .35); z-index: 2147483646; opacity: 0; pointer-events: none; }

      /* overlay: title cards, captions, key caps */
      #overlay { position: absolute; inset: 0; pointer-events: none; font-family: -apple-system, "SF Pro Display", BlinkMacSystemFont, sans-serif; }
      #card { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 22px; background: #fbfbfd; color: #1d1d1f; }
      #card.dark { background: #000; color: #f5f5f7; }
      #card .line { font-size: 92px; font-weight: 700; letter-spacing: -.04em; line-height: 1.04; }
      #card .line.sub { font-size: 34px; font-weight: 500; letter-spacing: -.012em; line-height: 1.3; color: #86868b; max-width: 1200px; margin: 0 auto; }
      .grad { background: linear-gradient(100deg, #ff8a65 0%, #ff5fa2 45%, #8b5cf6 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
      .logo { width: 120px; height: 120px; border-radius: 34px; margin: 0 auto 4px; background: linear-gradient(135deg, #ff8a65, #ff5fa2 48%, #8b5cf6); position: relative; box-shadow: 0 26px 60px -22px #ff5fa2; }
      .logo::after { content: ""; position: absolute; inset: 41px; border-radius: 50%; background: #fff; }
      #caption { position: absolute; left: 50%; top: 40px; padding: 16px 32px 18px; border-radius: 26px; text-align: center; opacity: 0;
        background: rgba(255, 255, 255, .78); backdrop-filter: blur(24px) saturate(180%); box-shadow: 0 24px 60px -24px rgba(76, 29, 149, .45), 0 0 0 .5px rgba(0, 0, 0, .06); }
      #caption .eyebrow { font-size: 14px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
      #caption .eyebrow { background: linear-gradient(90deg, #ff8a65, #ff5fa2, #8b5cf6); -webkit-background-clip: text; background-clip: text; color: transparent; }
      #caption .title { font-size: 34px; font-weight: 700; letter-spacing: -.022em; color: #1d1d1f; margin-top: 2px; white-space: nowrap; }
      #keys { position: absolute; left: 50%; bottom: 150px; transform: translateX(-50%); display: flex; gap: 14px; opacity: 0; }
      #keys span { min-width: 88px; height: 88px; padding: 0 22px; display: grid; place-items: center; border-radius: 20px; font-size: 40px; font-weight: 600; color: #1d1d1f; background: rgba(255, 255, 255, .94); box-shadow: 0 3px 0 #d2d2d7, 0 22px 50px -18px rgba(0, 0, 0, .4); }
      #keys.press span { transform: translateY(3px); box-shadow: 0 0 0 #d2d2d7, 0 12px 26px -16px rgba(0, 0, 0, .4); }

      /* Dark theme for the set (the fast film's "Dark." beat) */
      #wa.dark { background: #0b141a; color: #e9edef; }
      #wa.dark .side { background: #111b21; border-color: #222d34; } #wa.dark .search { background: #202c33; } #wa.dark .item.on { background: #2a3942; }
      #wa.dark .item small, #wa.dark .item time, #wa.dark header small, #wa.dark .meta { color: #8696a0; }
      #wa.dark .main { background: #0b141a; } #wa.dark header, #wa.dark footer { background: #202c33; border-color: #222d34; }
      #wa.dark .bubble { background: #202c33; color: #e9edef; } #wa.dark .row.out .bubble { background: #005c4b; }
      #wa.dark .box { background: #2a3942; color: #e9edef; } #wa.dark .plus { color: #aebac1; }

      /* Kinetic type (the fast film) */
      #type { position: absolute; inset: 0; display: none; place-content: center; text-align: center; gap: 26px; font-family: -apple-system, "SF Pro Display", BlinkMacSystemFont, sans-serif; }
      #type .w { font-size: 200px; font-weight: 800; letter-spacing: -.05em; line-height: .98; white-space: nowrap; }
      #type .w.m { font-size: 150px; } #type .w.s { font-size: 112px; letter-spacing: -.04em; white-space: normal; max-width: 1660px; margin: 0 auto; line-height: 1.04; }
      #type .sub { font-size: 46px; font-weight: 600; letter-spacing: -.015em; line-height: 1.3; opacity: .62; max-width: 1400px; margin: 0 auto; }
      #type .chips { display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; max-width: 1500px; margin: 0 auto; }
      #type .chips span { font-size: 40px; font-weight: 650; padding: 16px 32px; border-radius: 999px; border: 3px solid currentColor; opacity: .88; }
      #type .kc { display: inline-grid; place-items: center; min-width: 230px; height: 230px; margin: 0 14px; padding: 0 40px; border-radius: 48px; font-size: 120px; font-weight: 600; letter-spacing: 0; color: #1d1d1f; background: #fff; box-shadow: 0 8px 0 #d2d2d7, 0 40px 90px -30px rgba(0, 0, 0, .45); }
      #type .logo { width: 210px; height: 210px; border-radius: 58px; margin: 0 auto; }
      #type .logo::after { inset: 72px; }
    </style>
  </head>
  <body>
    <div id="camera">
      <div id="wa" class="app">
        <aside class="side">
          <h2>Chats</h2>
          <div class="search">Search or start a new chat</div>
          <div class="item on"><span class="avatar maya"></span><div><b>Maya</b><small>hey! it's Maya, from Arun's party 👋</small></div><time>9:04 pm</time></div>
          <div class="item"><span class="avatar arun"></span><div><b>Arun</b><small>bring the new bat 🏏</small></div><time>8:41 pm</time></div>
          <div class="item"><span class="avatar mom"></span><div><b>Mom</b><small>call me when you're free</small></div><time>6:15 pm</time></div>
          <div class="item"><span class="avatar team"></span><div><b>Design team</b><small>Sam: shipping on Friday!</small></div><time>4:02 pm</time></div>
        </aside>
        <section class="main">
          <header><span class="avatar maya"></span><div><b>Maya</b><small class="typing">online</small></div></header>
          <div class="list"></div>
          <footer><span class="plus">+</span><div class="box"></div><button class="send">➤</button></footer>
        </section>
      </div>
      <div id="ms" class="app">
        <nav><h2>Chats</h2><div class="on"><span class="avatar"></span>Priya</div><div><span class="avatar arun"></span>Arun</div><div><span class="avatar team"></span>Weekend crew</div></nav>
        <div class="pane">
          <div class="head"><span class="avatar"></span>Priya</div>
          <div class="log"></div>
          <form onsubmit="return false"><div contenteditable="true" role="textbox" aria-label="Message"></div><span class="go">Send</span></form>
        </div>
      </div>
      <svg id="cursor" viewBox="0 0 26 26"><path d="M4 2 L4 21 L9 16.5 L12.6 24 L16 22.4 L12.4 15 L19 15 Z" fill="#111" stroke="#fff" stroke-width="1.6" stroke-linejoin="round" /></svg>
      <div id="ripple"></div>
    </div>
    <div id="type"></div>
    <div id="overlay"><div id="card"></div><div id="caption"></div><div id="keys"></div></div>
    <script>window.SCRIPT = /*SCRIPT*/;</script>
    <script src="film.js"></script>
  </body>
</html>
