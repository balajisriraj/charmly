<!doctype html>
<!--
  A local test double of WhatsApp Web's chat markup, used by the unit and end-to-end tests.
  It reproduces only the hooks Charmly reads (#main, [data-pre-plain-text], .message-in/.message-out,
  .selectable-text, emoji <img alt>, the contenteditable composer in #main footer) with neutral styling.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Chat test page</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font: 14.5px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #e9edef; color: #111b21; height: 100vh; display: flex; }
      body.dark { background: #0b141a; color: #e9edef; }
      #side { width: 340px; background: #fff; border-right: 1px solid #d1d7db; }
      body.dark #side { background: #111b21; border-color: #222d34; }
      #side h2 { padding: 18px 16px; font-size: 20px; }
      .chat { display: flex; gap: 12px; padding: 12px 16px; cursor: pointer; border-bottom: 1px solid #f0f2f5; }
      body.dark .chat { border-color: #1f2c33; }
      .chat.on { background: #f0f2f5; } body.dark .chat.on { background: #2a3942; }
      .avatar { width: 46px; height: 46px; border-radius: 50%; background: linear-gradient(135deg, #fbc2eb, #a6c1ee); flex: none; }
      .chat small { display: block; color: #667781; font-size: 13px; }
      #main { flex: 1; display: flex; flex-direction: column; background: #efeae2; }
      body.dark #main { background: #0b141a; }
      #main header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: #f0f2f5; }
      body.dark #main header { background: #202c33; }
      #main header .avatar { width: 40px; height: 40px; }
      [role="application"] { flex: 1; overflow-y: auto; padding: 20px 8%; display: flex; flex-direction: column; gap: 4px; }
      [role="row"] { display: flex; }
      .message-in, .message-out { max-width: 65%; padding: 6px 9px 8px; border-radius: 8px; box-shadow: 0 1px .5px rgba(11, 20, 26, .13); }
      .message-in { background: #fff; } body.dark .message-in { background: #202c33; }
      .message-out { background: #d9fdd3; margin-left: auto; } body.dark .message-out { background: #005c4b; }
      .meta { display: block; text-align: right; font-size: 11px; color: #667781; margin-top: 2px; }
      img.emoji { width: 18px; height: 18px; vertical-align: -4px; }
      #main footer { display: flex; gap: 10px; align-items: center; padding: 10px 16px; background: #f0f2f5; }
      body.dark #main footer { background: #202c33; }
      [contenteditable] { flex: 1; min-height: 42px; padding: 10px 12px; border-radius: 8px; background: #fff; outline: none; white-space: pre-wrap; }
      body.dark [contenteditable] { background: #2a3942; }
      [contenteditable]:empty::before { content: "Type a message"; color: #8696a0; }
      .send { width: 40px; height: 40px; border-radius: 50%; border: 0; background: #00a884; color: #fff; font-size: 18px; }
    </style>
  </head>
  <body>
    <aside id="side">
      <h2>Chats</h2>
      <div class="chat on" data-chat="Ananya"><span class="avatar"></span><div><b>Ananya</b><small>guess what happened today!!</small></div></div>
      <div class="chat" data-chat="Arjun"><span class="avatar"></span><div><b>Arjun</b><small>are we still on for saturday?</small></div></div>
    </aside>
    <div id="main">
      <header><span class="avatar"></span><span dir="auto" title="Ananya">Ananya</span></header>
      <div role="application" id="list"></div>
      <footer>
        <div contenteditable="true" role="textbox" data-tab="10" title="Type a message"></div>
        <button class="send" aria-label="Send">➤</button>
      </footer>
    </div>
    <script>
      const list = document.getElementById("list");
      let clock = 9 * 60 + 41;
      const time = () => { clock++; return `${String(Math.floor(clock / 60)).padStart(2, "0")}:${String(clock % 60).padStart(2, "0")}`; };
      function add(dir, name, text) {
        const t = time();
        const row = document.createElement("div");
        row.setAttribute("role", "row");
        // Like WhatsApp, emoji render as images whose alt text is the emoji.
        const svg = (e) => "data:image/svg+xml," + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><text y="16" font-size="16">${e}</text></svg>`);
        const html = text.replace(/[😂😄🥳☕😊]/gu, (e) => `<img class="emoji" alt="${e}" src="${svg(e)}">`);
        row.innerHTML = `<div class="message-${dir}"><div class="copyable-text" data-pre-plain-text="[${t}, 03/11/2026] ${name}: "><span class="selectable-text"><span>${html}</span></span></div><span class="meta">${t}</span></div>`;
        list.appendChild(row);
        list.scrollTop = list.scrollHeight;
      }
      const CHATS = {
        Ananya: [
          ["out", "Me", "hey how did the interview go"],
          ["in", "Ananya", "it went okay i think, they asked so many system design questions 😄"],
          ["out", "Me", "haha classic. you'll be fine, you prepped loads"],
          ["in", "Ananya", "fingers crossed"],
          ["out", "Me", "let me know when you hear back!"],
        ],
        Arjun: [
          ["in", "Arjun", "machan are we still on for saturday?"],
          ["out", "Me", "yes da, 7pm right"],
        ],
      };
      function open(name) {
        list.innerHTML = "";
        document.querySelector("#main header [title]").setAttribute("title", name);
        document.querySelector("#main header [title]").textContent = name;
        document.querySelectorAll(".chat").forEach((c) => c.classList.toggle("on", c.dataset.chat === name));
        CHATS[name].forEach(([d, n, t]) => add(d, n, t));
      }
      document.querySelectorAll(".chat").forEach((c) => c.addEventListener("click", () => open(c.dataset.chat)));
      document.querySelector(".send").addEventListener("click", () => {
        const box = document.querySelector("[contenteditable]");
        if (box.textContent.trim()) { add("out", "Me", box.textContent.trim()); box.textContent = ""; }
      });
      // Test hooks.
      window.chat = {
        receive: (text) => add("in", document.querySelector("#main header [title]").title, text),
        send: (text) => add("out", "Me", text),
        open,
        dark: (on) => document.body.classList.toggle("dark", on),
        draft: () => document.querySelector("[contenteditable]").textContent,
      };
      open("Ananya");
    </script>
  </body>
</html>
