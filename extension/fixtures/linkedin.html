<!doctype html>
<!--
  A LinkedIn style thread, with the class names Charmly's LinkedIn hints look for. data-charmly-site makes the
  test build use those hints here; on linkedin.com they apply by host.
-->
<html lang="en" data-charmly-site="www.linkedin.com">
  <head>
    <meta charset="utf-8" />
    <title>Messaging | LinkedIn</title>
    <style>
      body { margin: 0; height: 100vh; display: flex; flex-direction: column; font: 14px/1.4 -apple-system, system-ui, sans-serif; background: #fff; }
      header { padding: 12px 16px; border-bottom: 1px solid #e0e0e0; }
      .msg-s-message-list { flex: 1; overflow-y: auto; padding: 12px 16px; list-style: none; margin: 0; }
      .msg-s-event-listitem { padding: 6px 0; }
      .msg-s-message-group__name { font-weight: 600; font-size: 13px; }
      form { border-top: 1px solid #e0e0e0; padding: 12px 16px; }
      .msg-form__contenteditable { min-height: 60px; padding: 8px; border-radius: 6px; background: #f4f2ee; outline: none; }
    </style>
  </head>
  <body>
    <header><span class="msg-entity-lockup__entity-title">Ananya Iyer</span></header>
    <ul class="msg-s-message-list" id="log"></ul>
    <form onsubmit="return false"><div class="msg-form__contenteditable" contenteditable="true" role="textbox" aria-label="Write a message…"></div></form>
    <script>
      const log = document.getElementById("log");
      function add(mine, name, text) {
        const li = document.createElement("li");
        li.className = "msg-s-event-listitem" + (mine ? "" : " msg-s-event-listitem--other");
        li.innerHTML = `<span class="msg-s-message-group__name"></span><p class="msg-s-event-listitem__body"></p>`;
        li.querySelector("span").textContent = name;
        li.querySelector("p").textContent = text;
        log.appendChild(li);
      }
      add(false, "Ananya Iyer", "Hi Balaji, loved your talk on agent design last week!");
      add(true, "Balaji Sri Raj", "Thank you Ananya, glad it was useful");
      add(false, "Ananya Iyer", "We're hiring for an AI lead role, would you be open to a chat?");
      window.chat = { receive: (t) => add(false, "Ananya Iyer", t) };
    </script>
  </body>
</html>
