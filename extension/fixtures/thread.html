<!doctype html>
<!--
  A Slack / Discord style channel: everyone on the left, each row with an avatar, a name and a time, and a
  plain textarea to write in. The generic reader should keep the words and drop names and times.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>(2) #weekend-plans - Acme</title>
    <style>
      body { margin: 0; height: 100vh; display: flex; flex-direction: column; font: 15px/1.46 -apple-system, system-ui, sans-serif; color: #1d1c1d; background: #fff; }
      .h { padding: 12px 20px; border-bottom: 1px solid #ddd; font-weight: 800; }
      .l { flex: 1; overflow-y: auto; padding: 8px 0; }
      .m { display: flex; gap: 8px; padding: 6px 20px; }
      .m:hover { background: #f8f8f8; }
      .av { width: 36px; height: 36px; border-radius: 6px; background: #e8912d; flex: none; }
      .c { flex: 1; min-width: 0; }
      .n { font-weight: 900; margin-right: 6px; }
      .t { font-size: 12px; color: #616061; }
      .w { padding: 0 20px 20px; }
      textarea { width: 100%; box-sizing: border-box; min-height: 64px; padding: 10px 12px; border: 1px solid #bbb; border-radius: 8px; font: inherit; resize: none; }
    </style>
  </head>
  <body>
    <div class="h"># weekend-plans</div>
    <div class="l" id="log"></div>
    <div class="w"><textarea placeholder="Message #weekend-plans"></textarea></div>
    <script>
      const log = document.getElementById("log");
      function add(name, text) {
        const row = document.createElement("div");
        row.className = "m";
        row.innerHTML = `<div class="av"></div><div class="c"><div><span class="n"></span><span class="t">10:42 AM</span></div><div class="x"></div></div>`;
        row.querySelector(".n").textContent = name;
        row.querySelector(".x").textContent = text;
        log.appendChild(row);
      }
      add("Priya Raman", "anyone up for a hike on Saturday?");
      add("Karthik", "I'm in if it's not too early 😅");
      add("Priya Raman", "8am start, coffee on the way, promise");
      const box = document.querySelector("textarea");
      window.chat = { receive: (t, n = "Karthik") => add(n, t), draft: () => box.value };
    </script>
  </body>
</html>
