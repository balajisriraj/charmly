<!doctype html>
<!--
  A Messenger / Telegram style chat for Charmly's generic reader: bubbles left and right, obfuscated class
  names, a centred date chip, times inside bubbles, a sidebar, and a rich-text message box. Nothing here is a
  hook Charmly knows about; it has to read the page from its layout.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Priya | Chats</title>
    <style>
      body { margin: 0; height: 100vh; display: flex; font: 14px/1.4 -apple-system, system-ui, sans-serif; color: #050505; background: #fff; }
      .a1 { width: 280px; border-right: 1px solid #e4e6eb; padding: 12px; }
      .a1 div { padding: 10px; border-radius: 8px; } .a1 div.on { background: #f0f2f5; font-weight: 600; }
      .a2 { flex: 1; display: flex; flex-direction: column; min-width: 0; }
      .a3 { height: 56px; display: flex; align-items: center; padding: 0 16px; border-bottom: 1px solid #e4e6eb; font-weight: 600; }
      .a4 { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 4px; }
      .a5 { display: flex; } .a5.k { justify-content: flex-end; }
      .a6 { max-width: 60%; padding: 8px 12px; border-radius: 18px; background: #f0f0f0; }
      .a5.k .a6 { background: #0084ff; color: #fff; }
      .a7 { font-size: 11px; opacity: .6; margin-left: 6px; }
      .a8 { align-self: center; font-size: 12px; color: #65676b; padding: 6px 0; }
      .a9 { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid #e4e6eb; }
      .a9 [contenteditable] { flex: 1; min-height: 20px; padding: 9px 14px; border-radius: 20px; background: #f0f2f5; outline: none; }
      .send { border: 0; background: none; color: #0084ff; font-weight: 600; cursor: pointer; }
    </style>
  </head>
  <body>
    <nav class="a1"><div class="on">Priya</div><div>Arun</div><div>Family group</div></nav>
    <div class="a2">
      <div class="a3">Priya</div>
      <div class="a4" id="log"><div class="a8">Today</div></div>
      <form class="a9" onsubmit="return false">
        <div contenteditable="true" role="textbox" aria-label="Message"></div>
        <button type="button" class="send">Send</button>
      </form>
    </div>
    <script>
      const log = document.getElementById("log");
      let minute = 40;
      function add(mine, text) {
        const row = document.createElement("div");
        row.className = "a5" + (mine ? " k" : "");
        row.innerHTML = `<div class="a6"><span></span><span class="a7">10:${minute++}</span></div>`;
        row.querySelector("span").textContent = text;
        log.appendChild(row);
        log.scrollTop = log.scrollHeight;
      }
      add(false, "hey! it was so fun meeting you at Arun's party 😊");
      add(true, "haha same, your karaoke was legendary");
      add(false, "omg don't remind me 🙈 what are you up to this week?");
      const box = document.querySelector("[contenteditable]");
      document.querySelector(".send").addEventListener("click", () => {
        if (box.textContent.trim()) add(true, box.textContent.trim());
        box.textContent = "";
      });
      window.chat = { receive: (t) => add(false, t), send: (t) => add(true, t), draft: () => box.textContent };
    </script>
  </body>
</html>
